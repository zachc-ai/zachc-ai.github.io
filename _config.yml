title: Zach's Compass
description: Notes on building, learning, and figuring things out.
url: "https://zachc.ai"
baseurl: ""
lang: en

theme: minima

permalink: /blog/:title/

header_pages:
  - blog.html
  - tags.html
  - about.md

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge

sass:
  style: compressed

# Working notes live in the repo but are not part of the site.
exclude:
  - CLAUDE.md
  - docs
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor


# Default link-preview image. feed.xml leaves it out of the RSS feed.
social_card: &social_card /assets/social-card.png

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"
      # Share card for links on X, LinkedIn, Slack, iMessage. A post can set its own `image:`.
      image:
        path: *social_card
        width: 1200
        height: 630
        alt: "Zach's Compass: notes on building, learning, and figuring things out"

author: ZachC

giscus:
  repo: "zachc-ai/zachc-ai.github.io"
  repo_id: "R_kgDORoQKJg"
  category: "Announcements"
  category_id: "DIC_kwDORoQKJs4C4jVh"
