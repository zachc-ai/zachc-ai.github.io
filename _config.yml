title: Zach's Compass
description: Notes on building, learning, and figuring things out.
url: "https://zachc.ai"
baseurl: ""
lang: en

theme: minima

permalink: /blog/:title/

header_pages:
  - blog.html
  - digests.html
  - tags.html
  - about.md

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

markdown: kramdown
highlighter: rouge

sass:
  style: compressed

# Working notes live in the repo but are not part of the site.
exclude:
  - CLAUDE.md
  - docs
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

author: ZachC

giscus:
  repo: "zachc-ai/zachc-ai.github.io"
  repo_id: "R_kgDORoQKJg"
  category: "Announcements"
  category_id: "DIC_kwDORoQKJs4C4jVh"
