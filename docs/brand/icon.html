<!doctype html>
<!-- Source for favicon.ico and apple-touch-icon.png. Rendered at 512px, then
     downscaled by docs/brand/render.sh. #touch gives the solid tile iOS needs. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  body { width: 512px; height: 512px; display: grid; place-items: center; }
  svg { width: 512px; height: 512px; }
  html.touch body { background: #faf9f6; }
  html.touch svg { width: 380px; height: 380px; }
</style>
<script>if (location.hash === '#touch') document.documentElement.className = 'touch';</script>
</head>
<body>
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="14" fill="#faf9f6" stroke="#1c1b19" stroke-width="2.5"/>
    <g transform="rotate(20 16 16)">
      <path fill="#b8432f" d="M16 4.5 L19.6 16 H12.4 Z"/>
      <path fill="#1c1b19" d="M16 27.5 L12.4 16 H19.6 Z"/>
    </g>
  </svg>
</body></html>
