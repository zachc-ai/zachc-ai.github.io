<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>An old CRT monitor whose screen glows like an open door</title>
  <desc>An original illustration of a boxy CRT monitor, keyboard and dial-up modem on a desk at dusk. The screen shows a bright open doorway with small stars around it.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d9b4"/>
      <stop offset="1" stop-color="#e8b383"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3150"/>
      <stop offset="1" stop-color="#2d5079"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#fff2c8" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffd98a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8774f"/>
      <stop offset="1" stop-color="#8a5f3d"/>
    </linearGradient>
    <clipPath id="tube">
      <rect x="462" y="150" width="276" height="212" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#wall)"/>
  <circle cx="1010" cy="150" r="64" fill="#f0a35e" opacity=".55"/>

  <rect y="468" width="1200" height="162" fill="url(#desk)"/>
  <rect y="468" width="1200" height="8" fill="#c08f63"/>

  <path d="M470 96h300l46 40v300l-46 30H470z" fill="#cfc4ad"/>
  <rect x="404" y="100" width="392" height="340" rx="28" fill="#e9e1cf"/>
  <rect x="404" y="100" width="392" height="340" rx="28" fill="none" stroke="#cbbfa6" stroke-width="3"/>
  <rect x="440" y="132" width="320" height="250" rx="22" fill="#c9bea7"/>
  <rect x="462" y="150" width="276" height="212" rx="26" fill="url(#screen)"/>

  <g clip-path="url(#tube)">
    <rect x="462" y="150" width="276" height="212" fill="url(#glow)"/>
    <path d="M568 362V262a32 32 0 0 1 64 0v100z" fill="#fff4d2"/>
    <path d="M568 362V262a32 32 0 0 1 64 0v100z" fill="none" stroke="#ffe3a1" stroke-width="6" opacity=".6"/>
    <path d="M520 362l48-6v6zm160 0-48-6v6z" fill="#ffe8b0" opacity=".5"/>
    <g fill="#fff7dc">
      <circle cx="506" cy="186" r="2.6"/>
      <circle cx="540" cy="214" r="1.8"/>
      <circle cx="660" cy="178" r="2.2"/>
      <circle cx="700" cy="226" r="2.8"/>
      <circle cx="618" cy="196" r="1.6"/>
      <circle cx="492" cy="252" r="1.8"/>
      <circle cx="712" cy="292" r="1.6"/>
      <circle cx="580" cy="174" r="1.4"/>
    </g>
    <g stroke="#ffffff" stroke-opacity=".05" stroke-width="2">
      <path d="M462 170h276M462 190h276M462 210h276M462 230h276M462 250h276M462 270h276M462 290h276M462 310h276M462 330h276M462 350h276"/>
    </g>
  </g>

  <rect x="676" y="400" width="54" height="10" rx="5" fill="#cbbfa6"/>
  <circle cx="752" cy="405" r="6" fill="#59c36a"/>
  <path d="M520 440h160l24 32H496z" fill="#d8ceb9"/>

  <path d="M410 492h380l26 52H384z" fill="#e3dac6"/>
  <g fill="#cfc4ad">
