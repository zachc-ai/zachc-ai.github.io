<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" style="width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">Who owns the whole change?</title>
  <desc id="description">An illustrative change crosses four specialty ownership boundaries. Below, one bounded team owns the same activities, retains required checks, and receives feedback.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L6 4L1 7" fill="none" stroke="#6f6a62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#faf9f6"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="64" y="72" fill="#1c1b19" font-size="32">Who owns the whole change?</text>
    <text x="64" y="105" fill="#6f6a62" font-size="17">An illustrative workflow, not a forecast of delivery time</text>

    <text x="64" y="164" fill="#6f6a62" font-size="15" letter-spacing="1.5">SPECIALTY OWNERSHIP</text>
    <g fill="#f2f0eb" stroke="#e6e2da" stroke-width="2">
      <rect x="64" y="188" width="205" height="96" rx="10"/>
      <rect x="353" y="188" width="205" height="96" rx="10"/>
      <rect x="642" y="188" width="205" height="96" rx="10"/>
      <rect x="931" y="188" width="205" height="96" rx="10"/>
    </g>
    <g fill="#1c1b19" font-size="21" text-anchor="middle">
      <text x="166" y="229">UI</text>
      <text x="455" y="229">Service</text>
      <text x="744" y="229">Data</text>
      <text x="1033" y="229">Release</text>
    </g>
    <g fill="#6f6a62" font-size="14" text-anchor="middle">
      <text x="166" y="257">owner A</text>
      <text x="455" y="257">owner B</text>
      <text x="744" y="257">owner C</text>
      <text x="1033" y="257">owner D</text>
    </g>
    <g fill="none" stroke="#6f6a62" stroke-width="2" marker-end="url(#arrow)">
      <path d="M281 236H341"/>
      <path d="M570 236H630"/>
      <path d="M859 236H919"/>
    </g>
    <g stroke="#b8432f" stroke-width="2" stroke-dasharray="4 5">
      <path d="M311 186V286"/>
      <path d="M600 186V286"/>
      <path d="M889 186V286"/>
    </g>

    <text x="64" y="350" fill="#6f6a62" font-size="15" letter-spacing="1.5">OUTCOME OWNERSHIP</text>
    <rect x="64" y="371" width="1072" height="203" rx="12" fill="#f2f0eb" stroke="#6f6a62" stroke-width="1.5"/>
    <text x="89" y="408" fill="#1c1b19" font-size="19">One bounded team + authorized agents</text>
    <text x="89" y="435" fill="#6f6a62" font-size="15">Shared context and decision rights; required checks stay</text>
    <g fill="#faf9f6" stroke="#e6e2da" stroke-width="1.5">
      <rect x="89" y="458" width="180" height="50" rx="7"/>
      <rect x="378" y="458" width="180" height="50" rx="7"/>
      <rect x="667" y="458" width="180" height="50" rx="7"/>
      <rect x="956" y="458" width="155" height="50" rx="7"/>
    </g>
    <g fill="#1c1b19" font-size="18" text-anchor="middle">
      <text x="179" y="490">UI</text>
      <text x="468" y="490">Service</text>
      <text x="757" y="490">Data</text>
      <text x="1033" y="490">Release</text>
    </g>
    <g fill="none" stroke="#6f6a62" stroke-width="2" marker-end="url(#arrow)">
      <path d="M281 483H366"/>
      <path d="M570 483H655"/>
      <path d="M859 483H944"/>
      <path d="M1033 520V545H179V520"/>
    </g>
    <rect x="514" y="530" width="172" height="28" fill="#f2f0eb"/>
    <text x="600" y="550" fill="#6f6a62" font-size="15" text-anchor="middle">Outcome feedback</text>
  </g>
</svg>
