# Display names for post tags, in the order they appear on /tags/.
# A tag used in a post but missing here still works; it shows its slug.
# `about` / `about_zh` is the one line shown under the tag on /tags/.
- slug: ai
  en: AI
  zh: AI
  about: "Working with AI: agents, harnesses, and what all the new options cost."
  about_zh: "用 AI 干活：agent、harness，还有选项太多的代价。"
- slug: engineering
  en: Engineering
  zh: 工程
  about: "Hands-on notes from building software, mostly with coding agents."
