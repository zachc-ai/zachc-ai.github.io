<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var root = document.documentElement;
      var saved = function (key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } };
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved('theme') || (dark ? 'dark' : 'light');
      var lang = saved('lang') || ((navigator.language || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en');
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-lang', lang);
      root.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
    })();
  </script>
  {%- seo -%}
  <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  {%- if page.layout == "post" %}
  <script src="{{ '/assets/post.js' | relative_url }}" defer></script>
  {%- endif %}
  {%- feed_meta -%}
  {%- include custom-head.html -%}
</head>
